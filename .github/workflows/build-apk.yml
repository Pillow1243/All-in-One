name: Build & Release OmniForge Pro Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 3.0.0
  VERSION_CODE: 3

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Preinstalled Android SDK (API 34)
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          SDKMGR="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi
          ls -la "$ANDROID_SDK/platforms" "$ANDROID_SDK/build-tools"

      - name: Install Dependencies & Run Tests
        run: |
          npm ci --no-audit --no-fund
          npx vitest run

      - name: Build Production Web Bundle & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Verify Brand Assets & App Identity
        run: |
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          grep -q '<string name="app_name">OmniForge Pro</string>' android/app/src/main/res/values/strings.xml
          grep -q "versionName \"$APP_VERSION\"" android/app/build.gradle
          grep -q "versionCode $VERSION_CODE" android/app/build.gradle
          echo "Launcher label: $(grep -o '<string name=\"app_name\">[^<]*' android/app/src/main/res/values/strings.xml)"

      - name: Prepare Release Keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/omniforge-release.jks"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          else
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "OmniForgePro#2026" \
              -alias "omniforge" \
              -keypass "OmniForgePro#2026" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OmniForge Pro, OU=Mobile, O=OmniForge, L=Tehran, S=Tehran, C=IR"
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASS=${ANDROID_KEYSTORE_PASS:-OmniForgePro#2026}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-omniforge}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASS=${ANDROID_KEY_PASS:-OmniForgePro#2026}" >> $GITHUB_ENV

      - name: Build Signed Release Android APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Zipalign, Verify Signature & Checksum APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          RAW_APK="android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p release-artifacts
          OUT_APK="release-artifacts/OmniForge-Pro-v${APP_VERSION}.apk"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$RAW_APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASS" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASS" \
            --out "$OUT_APK" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$OUT_APK"
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$OUT_APK" | grep -E "package:|application-label" || true
          sha256sum "$OUT_APK" > release-artifacts/SHA256SUMS.txt
          ls -lh release-artifacts/
          cat release-artifacts/SHA256SUMS.txt

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniForge-Pro-v3.0.0-APK
          path: |
            release-artifacts/OmniForge-Pro-v3.0.0.apk
            release-artifacts/SHA256SUMS.txt
          retention-days: 90

      - name: Publish Installable APK to GitHub Release (v3.0.0)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}"
          TITLE="OmniForge Pro v${APP_VERSION} — ANVIL Industrial Update (Android APK)"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## OmniForge Pro v3.0.0 — ANVIL

          انتشار ساخت صنعتی OmniForge Pro: ۳۲ دسته‌بندی و بیش از ۱٬۰۷۰ ابزار برای فایل، محاسبات، توسعه، تشخیص و گردش‌کارهای روزانه.

          ### فایل نصب
          - `OmniForge-Pro-v3.0.0.apk` — Android 5.1+
          - APK با `zipalign` و `apksigner` ساخته و اعتبارسنجی شده است.
          - نسخه برنامه: `3.0.0` · Android versionCode: `3`

          ### تغییرات اصلی
          - پوسته صنعتی زرد و مشکی با پنل‌های فنی، برچسب‌های ماژول و خروجی‌های monospace.
          - **کارگاه صنعتی، ۱۲ ماژول:** تبدیل واحدهای صنعتی، جرم قطعه، دور و پیشروی CNC، گشتاور پیچ، نیروی سیلندر هیدرولیک/پنوماتیک، انتقال دنده، قانون اهم، ظرفیت لوله، مصرف جوش، تلرانس RSS و برنامه سرویس.
          - آیکون تازه مهره شش‌ضلعی و اسپلش هم‌راستا برای Android، وب و PWA.
          - نوار وضعیت و نوار پیمایش Android با رنگ زرد و نمادهای تیره.
          - حفظ جستجوی سراسری، مسیر مستقیم ابزارها، پشتیبانی آفلاین و نام انگلیسی دستگاه `OmniForge Pro`.

          ### اعتبارسنجی
          - تست‌های Vitest برای کاتالوگ، ابزارهای هوشمند و محاسبات کارگاهی.
          - بیلد TypeScript + Vite و ساخت Android Release.
          - `SHA256SUMS.txt` همراه APK منتشر شده است.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "release-artifacts/OmniForge-Pro-v${APP_VERSION}.apk" \
              release-artifacts/SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          else
            gh release create "$TAG" \
              "release-artifacts/OmniForge-Pro-v${APP_VERSION}.apk" \
              release-artifacts/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
