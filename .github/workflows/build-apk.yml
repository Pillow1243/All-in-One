name: Build & Release OmniForge Pro Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 2.0.0
  VERSION_CODE: 2

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Preinstalled Android SDK (API 34)
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          SDKMGR="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi
          ls -la "$ANDROID_SDK/platforms" "$ANDROID_SDK/build-tools"

      - name: Install Dependencies & Run Tests
        run: |
          npm ci --no-audit --no-fund
          npx vitest run

      - name: Build Production Web Bundle & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Verify Brand Assets & App Identity
        run: |
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          grep -q '<string name="app_name">OmniForge Pro</string>' android/app/src/main/res/values/strings.xml
          grep -q "versionName \"$APP_VERSION\"" android/app/build.gradle
          echo "Launcher label: $(grep -o '<string name=\"app_name\">[^<]*' android/app/src/main/res/values/strings.xml)"

      - name: Prepare Release Keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/omniforge-release.jks"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          else
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "OmniForgePro#2026" \
              -alias "omniforge" \
              -keypass "OmniForgePro#2026" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OmniForge Pro, OU=Mobile, O=OmniForge, L=Tehran, S=Tehran, C=IR"
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASS=${ANDROID_KEYSTORE_PASS:-OmniForgePro#2026}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-omniforge}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASS=${ANDROID_KEY_PASS:-OmniForgePro#2026}" >> $GITHUB_ENV

      - name: Build Signed Release Android APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Zipalign, Verify Signature & Checksum APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          RAW_APK="android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p release-artifacts
          OUT_APK="release-artifacts/OmniForge-Pro-v${APP_VERSION}.apk"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$RAW_APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASS" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASS" \
            --out "$OUT_APK" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$OUT_APK"
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$OUT_APK" | grep -E "package:|application-label" || true
          sha256sum "$OUT_APK" > release-artifacts/SHA256SUMS.txt
          ls -lh release-artifacts/
          cat release-artifacts/SHA256SUMS.txt

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniForge-Pro-v2.0.0-APK
          path: |
            release-artifacts/OmniForge-Pro-v2.0.0.apk
            release-artifacts/SHA256SUMS.txt
          retention-days: 90

      - name: Publish Installable APK to GitHub Release (v2.0.0)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}"
          TITLE="OmniForge Pro v${APP_VERSION} — Forge Release (Android APK)"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## 🚀 OmniForge Pro v2.0.0 — «Forge»

          سوپراپلیکیشن **۱۰۰٪ رایگان** اندروید: **۳۱ دسته‌بندی** و **۱٬۰۶۰+ ابزار واقعی و آفلاین**، حالا با رابط کاربری بازطراحی‌شده، جستجوی همه‌جا و ۲۴ ابزار هوشمند تازه.

          ### 📥 نصب روی اندروید
          1. فایل **`OmniForge-Pro-v2.0.0.apk`** را از بخش Assets دانلود کنید.
          2. روی گوشی (Android 5.1 تا 15+) نصب کنید.
          3. APK با `zipalign` بهینه و با `apksigner` (v1/v2/v3) امضا شده است.

          ### ✨ در این نسخه
          - **دسته ۳۱ تازه — Smart Utilities 2.0:** عدد به حروف فارسی، اسلاگ فارسی، JSON↔CSV و مقایسه ساختاری، توضیح‌گر Cron، UUID/ULID/NanoID، تاریخ جلالی و تایم‌استمپ، کارت/شبا/کد ملی، قیمت واحد، سن دقیق، درصد و تخفیف، آزمایشگاه رنگ با کنتراست WCAG، سازنده QR (وای‌فای/ویزیت/پیامک)، Base64، نمایشگر CSV، پیش‌نمایش Markdown، متن نمونه فارسی، قرعه‌کشی و تقسیم صورتحساب.
          - **پالت فرمان (Ctrl/⌘ + K)** با جستجوی فازی و کنترل کامل با کیبورد.
          - **رابط کاربری تازه:** سیستم طراحی ۲.۰، حالت روشن/تاریک/OLED دقیق‌تر، انیمیشن‌های ملایم، احترام به «کاهش حرکت»، ناحیه امن دستگاه.
          - **لینک مستقیم هر ابزار** (`#/tool/…`) و اشتراک‌گذاری با Share Sheet اندروید.
          - **آیکون و هویت بصری جدید** (حلقه آهنگری) با هندسه برداری در همه تراکم‌ها و اسپلش تازه.
          - **نام ثبت‌شده روی گوشی:** `OmniForge Pro` (انگلیسی).
          - بهینه‌سازی بارگذاری موتورها، کش آفلاین PWA و پایداری تست‌ها.

          ### 🧪 کیفیت
          - `npx vitest run` — ۲۶ تست خودکار (کاتالوگ، رمزنگاری، NLP فارسی، ۲۴ ابزار هوشمند و رندر واقعی رابط کاربری)
          - بیلد تولیدی TypeScript + Vite بدون خطا
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "release-artifacts/OmniForge-Pro-v${APP_VERSION}.apk" \
              release-artifacts/SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          else
            gh release create "$TAG" \
              "release-artifacts/OmniForge-Pro-v${APP_VERSION}.apk" \
              release-artifacts/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
